[project]
name = "photosift"
version = "0.1.0"
description = "相片整理與比賽選片助手：地端模型粗篩與標註，外部模型教練與決選"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "rawpy>=0.22",
    "exifread>=3.0",
    "platformdirs>=4.2",
    "keyring>=25.0",
    "geonamescache>=2.0",
    "torch>=2.4",
    "open-clip-torch>=2.30",
    "transformers>=4.45",
    "anthropic>=2.0",
    "pywebview>=5.3; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.scripts]
photosift = "photosift.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photosift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
